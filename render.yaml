services:
  - type: web
    name: python-preparation-application
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn Python_Preparation.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: python-preparation-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

databases:
  - name: python-preparation-db
